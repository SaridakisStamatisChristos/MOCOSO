name: G12 exact linear omission certificates and adversarial SOTA screen
on:
  pull_request:
    paths:
      - 'experiments/v03/g12_linear_certificate.py'
      - 'experiments/v03/g12_certified_hybrid.py'
      - 'tests/test_v03_g12_linear_certificate.py'
      - 'benchmarks/g12_rfp_matched.py'
      - 'research/v03/g12/**'
      - '.github/workflows/v03-g12-rfp.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONPATH: '.'
jobs:
  independent-selected-subset-oracle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prevent rewriting historical programs and evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c3ecab667901347b725b580237f4ab16f9b168d3 -- \
            modconvex.py experiments/v03/g8_persistent_intervals.py \
            experiments/v03/g9_quadratic_lex.py \
            experiments/v03/g10_direct_next.py \
            experiments/v03/g11_hybrid.py \
            research/v03/g10/G10_DIRECT_NEXT_PROOF.md \
            research/v03/g9_paper/manuscript.md
      - name: Independent exhaustive selected-mask oracle and adversarial cases
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_v03_g12_linear_certificate 2>&1 | tee g12_rfp_regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g12-rfp-exact-${{ matrix.os }}-py${{ matrix.python }}
          path: g12_rfp_regression.log
          retention-days: 90
  preregistered-crossover:
    needs: independent-selected-subset-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Smoke crossover, all outcomes retained
        run: python benchmarks/g12_rfp_matched.py --profile smoke --repeats 3 --output g12_rfp_smoke.json
      - name: Extended original plus 240-case holdout
        run: python benchmarks/g12_rfp_matched.py --profile full --repeats 5 --output g12_rfp_full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g12-rfp-raw-original-holdout
          path: |
            g12_rfp_smoke.json
            g12_rfp_full.json
          retention-days: 90
